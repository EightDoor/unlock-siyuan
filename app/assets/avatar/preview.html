<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIP 默认头像预览</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ebe7df; }
    main { display: grid; gap: 18px; justify-items: center; padding: 36px; }
    .preview { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }
    figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
    img { width: 192px; height: 192px; }
    figure:last-child { padding: 24px; border-radius: 22px; background: #191610; }
    figcaption { font-size: 12px; color: #645f56; }
    figure:last-child figcaption { color: #b9ab8d; }
    @media (prefers-color-scheme: dark) { body { background: #302c26; } figcaption { color: #cfc6b6; } }
  </style>
</head>
<body>
  <main>
    <div class="preview">
      <figure>
        <img src="../../appearance/avatar/default-vip.svg" alt="VIP 默认头像，浅色背景">
        <figcaption>浅色背景</figcaption>
      </figure>
      <figure>
        <img src="../../appearance/avatar/default-vip.svg" alt="VIP 默认头像，深色背景">
        <figcaption>深色背景</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
